plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'SmartBrainLib'
        url = 'https://dl.cloudsmith.io/public/tslat/sbl/maven/'
    }
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            if (providers.gradleProperty('phase5f_apo_benchmark').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase5f.apoBenchmark', 'true'
            }
            if (providers.gradleProperty('phase5f_suite_a').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase5f.suiteA', 'true'
            }
            def phase5fSuiteABoss = providers.gradleProperty('phase5f_suite_a_boss').getOrNull()
            if (phase5fSuiteABoss != null) systemProperty 'tno.phase5f.suiteABoss', phase5fSuiteABoss
            def phase5fSuiteAShots = providers.gradleProperty('phase5f_suite_a_shots').getOrNull()
            if (phase5fSuiteAShots != null) systemProperty 'tno.phase5f.suiteAShots', phase5fSuiteAShots
            def phase5fSuiteATicks = providers.gradleProperty('phase5f_suite_a_ticks').getOrNull()
            if (phase5fSuiteATicks != null) systemProperty 'tno.phase5f.suiteATicks', phase5fSuiteATicks
            if (providers.gradleProperty('phase5f_suite_b').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase5f.suiteB', 'true'
            }
            def phase5fSuiteBFamily = providers.gradleProperty('phase5f_suite_b_family').getOrNull()
            if (phase5fSuiteBFamily != null) systemProperty 'tno.phase5f.suiteBFamily', phase5fSuiteBFamily
            def phase5fSuiteBBoss = providers.gradleProperty('phase5f_suite_b_boss').getOrNull()
            if (phase5fSuiteBBoss != null) systemProperty 'tno.phase5f.suiteBBoss', phase5fSuiteBBoss
            def phase5fSuiteBShots = providers.gradleProperty('phase5f_suite_b_shots').getOrNull()
            if (phase5fSuiteBShots != null) systemProperty 'tno.phase5f.suiteBShots', phase5fSuiteBShots
            def phase5fSuiteBTicks = providers.gradleProperty('phase5f_suite_b_ticks').getOrNull()
            if (phase5fSuiteBTicks != null) systemProperty 'tno.phase5f.suiteBTicks', phase5fSuiteBTicks
            if (providers.gradleProperty('phase5f_suite_b_diagnostic').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase5f.suiteBDiagnostic', 'true'
            }
            if (providers.gradleProperty('phase5f_suite_c').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase5f.suiteC', 'true'
            }
            def phase5fSuiteCFamily = providers.gradleProperty('phase5f_suite_c_family').getOrNull()
            if (phase5fSuiteCFamily != null) systemProperty 'tno.phase5f.suiteCFamily', phase5fSuiteCFamily
            def phase5fSuiteCBoss = providers.gradleProperty('phase5f_suite_c_boss').getOrNull()
            if (phase5fSuiteCBoss != null) systemProperty 'tno.phase5f.suiteCBoss', phase5fSuiteCBoss
            def phase5fSuiteCShots = providers.gradleProperty('phase5f_suite_c_shots').getOrNull()
            if (phase5fSuiteCShots != null) systemProperty 'tno.phase5f.suiteCShots', phase5fSuiteCShots
            def phase5fSuiteCTicks = providers.gradleProperty('phase5f_suite_c_ticks').getOrNull()
            if (phase5fSuiteCTicks != null) systemProperty 'tno.phase5f.suiteCTicks', phase5fSuiteCTicks
            if (providers.gradleProperty('phase5f_suite_c_diagnostic').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase5f.suiteCDiagnostic', 'true'
            }
            if (providers.gradleProperty('phase5f_suite_c_fast_ticks').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase5f.suiteCFastTicks', 'true'
            }
            if (providers.gradleProperty('phase5f_suite_c_endgame').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase5f.suiteCEndgame', 'true'
            }
            if (providers.gradleProperty('phase6_endgame_research').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase6.endgameResearch', 'true'
            }
            def phase6EndgameFamily = providers.gradleProperty('phase6_endgame_family').getOrNull()
            if (phase6EndgameFamily != null) systemProperty 'tno.phase6.endgameFamily', phase6EndgameFamily
            def phase6EndgameBoss = providers.gradleProperty('phase6_endgame_boss').getOrNull()
            if (phase6EndgameBoss != null) systemProperty 'tno.phase6.endgameBoss', phase6EndgameBoss
            def phase6EndgameShots = providers.gradleProperty('phase6_endgame_shots').getOrNull()
            if (phase6EndgameShots != null) systemProperty 'tno.phase6.endgameShots', phase6EndgameShots
            def phase6EndgameTicks = providers.gradleProperty('phase6_endgame_ticks').getOrNull()
            if (phase6EndgameTicks != null) systemProperty 'tno.phase6.endgameTicks', phase6EndgameTicks
            if (providers.gradleProperty('phase6_calibration').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase6.calibration', 'true'
            }
            def phase6CalibrationMode = providers.gradleProperty('phase6_calibration_mode').getOrNull()
            if (phase6CalibrationMode != null) systemProperty 'tno.phase6.calibrationMode', phase6CalibrationMode
            def phase6CalibrationFamily = providers.gradleProperty('phase6_calibration_family').getOrNull()
            if (phase6CalibrationFamily != null) systemProperty 'tno.phase6.calibrationFamily', phase6CalibrationFamily
            def phase6CalibrationBoss = providers.gradleProperty('phase6_calibration_boss').getOrNull()
            if (phase6CalibrationBoss != null) systemProperty 'tno.phase6.calibrationBoss', phase6CalibrationBoss
            def phase6CalibrationShots = providers.gradleProperty('phase6_calibration_shots').getOrNull()
            if (phase6CalibrationShots != null) systemProperty 'tno.phase6.calibrationShots', phase6CalibrationShots
            def phase6CalibrationTicks = providers.gradleProperty('phase6_calibration_ticks').getOrNull()
            if (phase6CalibrationTicks != null) systemProperty 'tno.phase6.calibrationTicks', phase6CalibrationTicks
            if (providers.gradleProperty('phase5f_l2_trait_matrix').map(String::toBoolean).getOrElse(false)) {
                systemProperty 'tno.phase5f.l2TraitMatrix', 'true'
            }
            def phase5fL2TraitMode = providers.gradleProperty('phase5f_l2_trait_mode').getOrNull()
            if (phase5fL2TraitMode != null) systemProperty 'tno.phase5f.l2TraitMode', phase5fL2TraitMode
            def phase5fL2TraitBoss = providers.gradleProperty('phase5f_l2_trait_boss').getOrNull()
            if (phase5fL2TraitBoss != null) systemProperty 'tno.phase5f.l2TraitBoss', phase5fL2TraitBoss
            def phase5fL2Trait = providers.gradleProperty('phase5f_l2_trait').getOrNull()
            if (phase5fL2Trait != null) systemProperty 'tno.phase5f.l2Trait', phase5fL2Trait
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Tensura and ManasCore are distributed publicly through Modrinth Maven. The
    // ManasCore artifact bundles its complete NeoForge module set with Jar-in-Jar.
    implementation "maven.modrinth:Br0kXPwc:${tensura_modrinth_version}"
    implementation "maven.modrinth:wRRSWpd1:${manascore_modrinth_version}"

    // Tensura's required runtime libraries. These are explicit because Modrinth
    // Maven artifacts intentionally do not provide transitive dependency metadata.
    implementation "dev.architectury:architectury-neoforge:${architectury_api_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "net.tslat.smartbrainlib:SmartBrainLib-neoforge-${minecraft_version}:${smartbrainlib_version}"
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Royal Variations is deliberately runtime-only for local compatibility
    // testing. A clean clone without the private JAR needs no Royal Variations
    // runtime dependencies and never references its classes at compile time.
    def phase5fRuntimeModsDir = providers.gradleProperty('phase5f_runtime_mods_dir')
            .map { file(it) }
            .getOrNull()
    def phase5fCuriosJar = phase5fRuntimeModsDir?.isDirectory()
            ? fileTree(phase5fRuntimeModsDir) { include 'curios-neoforge-*.jar' }.files.find()
            : null

    def royalVariationsRuntimeJar = file("libs/${royal_variations_jar}")
    if (royalVariationsRuntimeJar.isFile()) {
        localRuntime files(royalVariationsRuntimeJar)
        if (phase5fCuriosJar != null) {
            localRuntime files(phase5fCuriosJar)
        }
        else {
            localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
        }
    }

    // Optional Phase 5F benchmark stack. Nothing is added unless an explicit
    // local mod directory is supplied with -Pphase5f_runtime_mods_dir=... .
    // These files remain runtime-only and are never published transitively.
    if (phase5fRuntimeModsDir?.isDirectory()) {
        localRuntime fileTree(phase5fRuntimeModsDir) {
            include 'Placebo-*.jar'
            include 'ApothicAttributes-*.jar'
            include 'ApothicEnchanting-*.jar'
            include 'ApothicSpawners-*.jar'
            include 'Apotheosis-*.jar'
            include 'apothic_equipment-*.jar'
            include 'ancientreforging-*.jar'
            include 'apothicnightmares-*.jar'
            include 'apotheosis_balance-*.jar'
            include 'l2library-*.jar'
            include 'l2complements-*.jar'
            include 'l2hostility-*.jar'
            include 'tensura_neb-neoforge-*.jar'
            include 'Patchouli-*.jar'
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            tensura_version        : tensura_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
